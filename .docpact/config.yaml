version: 1
layout: repo
lastReviewedAt: "2026-10-30"
lastReviewedCommit: "56e912858aa769ff13075fa852a344d0b730a3b9"
lastReviewedNote: "PCR #159: reviewed stable product 0.4.10 preparation at 56e91285. Authority, three package mirrors and docs lock root metadata advance together; dependency resolutions, canonical content, methodology/translation state, reader minimum and runtime pins remain unchanged. Current preparation notes distinguish verified public 0.4.9 from pending new tag qualification, coordinated npm/site publication and exact workspace integration."

catalog:
  repos:
    - id: pcr
      path: .
      canonicalRepo: tiangong-lca/pcr
      entryDoc: AGENTS.md
      workflowDocs:
        - README.md
        - docs/architecture.md
        - docs/authoring-guide.md
        - docs/classification-policy.md
        - docs/pcr-library-release-policy.md
        - docs/pcr-documentation-site-contract.md
        - docs/offline-distribution.md
        - docs/agentic-consumption.md
        - docs/typescript-engineering.md
        - docs/semantic-projection-contract.md
        - docs/dependency-maintenance.md
      workspaceIntegrationRequired: true

ownership:
  domains:
    - id: repo-governance-and-docs
      paths:
        include:
          - AGENTS.md
          - README.md
          - LICENSE
          - .docpact/config.yaml
          - .gitignore
          - .gitattributes
          - edgeone.json
          - product-release.json
          - .nvmrc
          - tsconfig*.json
          - config/typescript-migration.json
          - config/coverage.json
          - scripts/engineering/**
          - tests/browser/**
          - tests/agent/**
          - package-lock.json
          - .github/workflows/**
          - .github/dependabot.yml
          - docs/**
      ownerRepo: pcr
    - id: builder-cli-and-schemas
      paths:
        include:
          - package.json
          - builder/**
      ownerRepo: pcr
    - id: classification-sources-and-mappings
      paths:
        include:
          - classifications/**
      ownerRepo: pcr
    - id: reusable-method-modules
      paths:
        include:
          - library/modules/**
          - library/indexes/**
          - library/catalog.yaml
      ownerRepo: pcr
    - id: pcr-consumption-tools
      paths:
        include:
          - packages/**
          - scripts/vendor/workspace-seo/**
          - skills/**
          - .github/ISSUE_TEMPLATE/**
      ownerRepo: pcr

coverage:
  include:
    - .gitattributes
    - scripts/vendor/workspace-seo/**
    - AGENTS.md
    - README.md
    - LICENSE
    - .docpact/config.yaml
    - .gitignore
    - docs/**
    - package.json
    - package-lock.json
    - .nvmrc
    - tsconfig*.json
    - config/typescript-migration.json
    - config/coverage.json
    - scripts/engineering/**
    - tests/browser/**
    - tests/agent/**
    - edgeone.json
    - builder/**
    - classifications/**
    - packages/**
    - skills/**
    - .github/workflows/**
    - .github/dependabot.yml
    - .github/ISSUE_TEMPLATE/**
    - library/catalog.yaml
    - library/indexes/**
    - library/modules/**
  exclude:
    - .git/**
    - .docpact/runs/**
    - node_modules/**
    - dist/**
    - packages/pcr-docs/node_modules/**
    - packages/pcr-docs/.generated/**
    - packages/pcr-docs/.generated-stage-*/**
    - packages/pcr-docs/.next/**
    - packages/pcr-docs/out/**
    - packages/pcr-docs/public/generated/**
    - coverage/**
    - library/pcrs/**
    - "*.log"

freshness:
  warn_after_commits: 40
  warn_after_days: 60
  critical_after_days: 120

routing:
  intents:
    repo-docs:
      paths:
        - AGENTS.md
        - README.md
        - .docpact/config.yaml
        - .gitignore
        - docs/**
    builder:
      paths:
        - package.json
        - builder/**
    classification:
      paths:
        - classifications/**
        - docs/classification-policy.md
    modules:
      paths:
        - library/modules/**
        - library/indexes/**
        - library/catalog.yaml
        - docs/authoring-guide.md
    proof:
      paths:
        - package.json
        - builder/cli/**
        - builder/scripts/**
        - .github/workflows/**
    consumption:
      paths:
        - packages/**
        - skills/**
        - .github/ISSUE_TEMPLATE/**
        - README.md
        - docs/architecture.md

docInventory:
  include:
    - AGENTS.md
    - README.md
    - .docpact/config.yaml
    - docs/architecture.md
    - docs/authoring-guide.md
    - docs/classification-policy.md
    - docs/pcr-library-release-policy.md
    - docs/pcr-documentation-site-contract.md
    - docs/offline-distribution.md
    - docs/agentic-consumption.md
    - docs/typescript-engineering.md
    - docs/dependency-maintenance.md

repo:
  id: pcr
  owner: pcr

rules:
  - id: pcr-bootstrap-contract
    scope: repo
    repo: pcr
    triggers:
      - path: AGENTS.md
        kind: repo-contract
      - path: README.md
        kind: repo-landing
      - path: LICENSE
        kind: distribution-license
      - path: .docpact/config.yaml
        kind: docpact-config
      - path: .gitignore
        kind: repo-ignore-policy
      - path: .gitattributes
        kind: generated-snapshot-encoding
      - path: .github/workflows/**
        kind: repo-validation-workflow
      - path: docs/**
        kind: repo-doc
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/architecture.md
        mode: review_or_update
      - path: docs/authoring-guide.md
        mode: review_or_update
    reason: Repository entry docs, architecture, and authoring guidance must stay aligned with PCR identity and builder contracts.
  - id: pcr-builder-contract
    scope: repo
    repo: pcr
    triggers:
      - path: package.json
        kind: package-script
      - path: builder/**
        kind: builder-surface
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
      - path: docs/architecture.md
        mode: review_or_update
      - path: docs/authoring-guide.md
        mode: review_or_update
    reason: Builder CLI, templates, and schemas define how PCR records are generated and validated.
  - id: pcr-release-policy-contract
    scope: repo
    repo: pcr
    triggers:
      - path: builder/cli/index.ts
        kind: release-command-entry
      - path: builder/lib/builder-operations.ts
        kind: release-operations
      - path: builder/lib/published-revision-state.ts
        kind: release-state
      - path: builder/lib/pcr-directory-transaction.ts
        kind: release-transaction
      - path: docs/pcr-library-release-policy.md
        kind: release-policy
    requiredDocs:
      - path: docs/pcr-library-release-policy.md
        mode: review_or_update
      - path: AGENTS.md
        mode: review_or_update
    reason: Publication, revision and recovery changes must retain the immutable release-chain policy and its agent-facing boundary.
  - id: pcr-classification-contract
    scope: repo
    repo: pcr
    triggers:
      - path: classifications/**
        kind: classification-source-or-mapping
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: docs/classification-policy.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
    reason: Classification source and mapping changes must preserve the boundary between external classification systems and canonical PCR identity.
  - id: pcr-module-contract
    scope: repo
    repo: pcr
    triggers:
      - path: library/modules/**
        kind: method-module
      - path: library/indexes/**
        kind: pcr-index
      - path: library/catalog.yaml
        kind: pcr-catalog
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: docs/architecture.md
        mode: review_or_update
      - path: docs/authoring-guide.md
        mode: review_or_update
    reason: Reusable method modules and indexes are shared PCR authoring surfaces.
  - id: pcr-consumption-contract
    scope: repo
    repo: pcr
    triggers:
      - path: packages/**
        kind: public-consumption-tooling
      - path: skills/**
        kind: agent-skill
      - path: .github/ISSUE_TEMPLATE/**
        kind: feedback-intake-surface
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
      - path: docs/architecture.md
        mode: review_or_update
      - path: docs/authoring-guide.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agentic-consumption.md
        mode: review_or_update
    reason: Public PCR consumption tools and feedback intake surfaces must stay aligned with repository boundaries and authoring workflows.

  - id: pcr-documentation-site
    scope: repo
    repo: pcr
    triggers:
      - path: packages/pcr-docs/**
        kind: generated-public-documentation
      - path: scripts/vendor/workspace-seo/**
        kind: generated-build-and-proof
      - path: packages/pcr-core/src/languages.ts
        kind: source-language-contract
      - path: packages/pcr-core/src/index.ts
        kind: canonical-document-reader
      - path: builder/lib/pcr-document-history.ts
        kind: historical-document-reader
      - path: edgeone.json
        kind: static-production-hosting
    requiredDocs:
      - path: docs/pcr-documentation-site-contract.md
        mode: review_or_update
      - path: docs/architecture.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
    reason: Public documents must retain complete canonical text, exact artifacts, language and lifecycle identities, and the static production contract.

  - id: offline-distribution
    scope: repo
    repo: pcr
    triggers:
      - path: builder/scripts/npm-release*.ts
        kind: npm-release-contract
      - path: builder/scripts/reader-compatibility*.ts
        kind: reader-content-compatibility
      - path: builder/scripts/product-*.ts
        kind: product-release-contract
      - path: tsconfig.runtime.json
        kind: compiled-runtime-distribution
      - path: builder/scripts/runtime-build.contracts.test.ts
        kind: compiled-runtime-distribution-proof
      - path: product-release.json
        kind: product-version-source
      - path: .github/workflows/publish.yml
        kind: npm-publication
      - path: .github/workflows/tag-release-from-merge.yml
        kind: npm-release-tags
      - path: packages/tiangong-pcr-library/**
        kind: content-package
      - path: LICENSE
        kind: distribution-license
      - path: builder/scripts/build-offline-*
        kind: offline-builder
      - path: packages/pcr-core/src/offline-library.ts
        kind: offline-reader
      - path: packages/pcr-core/src/source-context.ts
        kind: storage-boundary
      - path: packages/tiangong-pcr-cli/**
        kind: public-cli
    requiredDocs:
      - path: docs/offline-distribution.md
        mode: review_or_update
    reason: Offline package layout, integrity, language availability and compatibility are one public contract.

  - id: typescript-engineering
    scope: repo
    repo: pcr
    triggers:
      - path: .nvmrc
        kind: runtime-pin
      - path: tsconfig*.json
        kind: typescript-project
      - path: config/typescript-migration.json
        kind: migration-inventory
      - path: scripts/engineering/**
        kind: engineering-command
      - path: scripts/engineering/fixtures/provider-importer-producer.ts
        kind: test-fixture
      - path: packages/pcr-core/offline-library.test.ts
        kind: compact-offline-qualification
      - path: packages/pcr-core/full-corpus.offline.test.ts
        kind: full-corpus-qualification
      - path: packages/pcr-core/fixtures/offline-distribution-fixture.ts
        kind: test-fixture
      - path: tests/browser/**
        kind: browser-qualification
      - path: tests/agent/**
        kind: bounded-agent-evaluation
      - path: config/coverage.json
        kind: source-accounted-coverage
      - path: package.json
        kind: validation-entrypoint
      - path: .github/workflows/**
        kind: engineering-qualification
    requiredDocs:
      - path: docs/typescript-engineering.md
        mode: review_or_update
      - path: docs/repository-coding-guidelines.md
        mode: review_or_update
      - path: AGENTS.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
    reason: Runtime pins, strict source migration, complete test discovery and artifact qualification must remain explicit during the TypeScript refactor.

  - id: pcr-root-generated-lock
    scope: repo
    repo: pcr
    triggers:
      - path: package-lock.json
        kind: generated-dependency-resolution
    requiredDocs:
      - path: docs/dependency-maintenance.md
        mode: must_exist
      - path: docs/typescript-engineering.md
        mode: must_exist
    reason: Generated root dependency resolution requires available maintenance and qualification guidance; compatibility review and complete exact-source CI remain required without rewriting unchanged contract metadata.

  - id: normative-source-context
    scope: repo
    repo: pcr
    triggers:
      - path: packages/pcr-core/src/compiler/**
        kind: normative-source-compiler
      - path: packages/pcr-core/src/projection-integrity.ts
        kind: normative-source-integrity
      - path: packages/pcr-core/src/consumption-guidance.ts
        kind: complete-guidance-selection
      - path: packages/pcr-core/schemas/structured-projection.schema.json
        kind: normative-projection-contract
      - path: packages/pcr-core/schemas/guidance-output.schema.json
        kind: normative-guidance-contract
      - path: builder/lib/markdown-projection.ts
        kind: source-projection
      - path: builder/lib/structured-yaml-projection.ts
        kind: source-projection-serialization
    requiredDocs:
      - path: docs/semantic-projection-contract.md
        mode: review_or_update
      - path: docs/agentic-consumption.md
        mode: review_or_update
      - path: docs/authoring-guide.md
        mode: review_or_update
    reason: Normative source context, citation identities, compatibility and complete guidance must remain one explicit contract.

  - id: pcr-dependency-maintenance
    scope: repo
    repo: pcr
    triggers:
      - path: .github/dependabot.yml
        kind: dependency-discovery
      - path: docs/dependency-maintenance.md
        kind: maintenance-guide
    requiredDocs:
      - path: docs/dependency-maintenance.md
        mode: review_or_update
    reason: Discovery scope and traffic need focused guidance while semantic manifest, lock, reader, asset and publication rules stay intact.
